services:
  remnawave-node:
    build: .
    container_name: remnawave-node
    restart: always
    # Host networking: Xray inbounds are managed from the panel and must bind host ports.
    network_mode: host
    # Needed for the firewall plugins and for killing connections of removed users.
    cap_add:
      - NET_ADMIN
    environment:
      - NODE_PORT=2222
      - SECRET_KEY=${SECRET_KEY:?paste the SECRET_KEY generated by the panel}
